<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Farming knowledge from people who grow it: stories, questions and answers from Bangladeshi farmers and agronomists." />
    <meta name="theme-color" content="#1F6B3A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1A17" media="(prefers-color-scheme: dark)" />
    <title>AgroTrends</title>
    <script>
      // Apply a saved theme or language before the first paint (src/lib/theme.ts and src/lib/i18n.ts own them).
      try {
        var theme = localStorage.getItem('agrotrends.theme')
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
        if (localStorage.getItem('agrotrends.lang') === 'bn') document.documentElement.lang = 'bn'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
